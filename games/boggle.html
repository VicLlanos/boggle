<!-- Arenova · Boggle screen. Loaded into #gameScreens by index.html -->
<section id="screen-game" class="screen">
  <div class="leave-row"><button type="button" class="game-leave-btn" title="Leave this game" aria-label="Leave this game">↩ Leave game</button></div>
  <div class="game-top">
    <div class="timer" id="timerRing"><span id="timerText">180</span></div>
    <div class="scores" id="scoreBoard"></div>
    <button class="snd-btn" id="btnSound" title="Toggle sound" aria-label="Toggle sound">🔊</button>
  </div>
  <div class="word-bar hint" id="currentWord" style="position:relative">Drag letters to spell<span class="combo-badge" id="comboBadge">×2</span></div>
  <div class="board-wrap" id="boardWrap">
    <div class="wells" aria-hidden="true"><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div><div class="well"></div></div>
    <div class="board" id="board"></div>
    <svg class="path-svg" id="pathSvg"></svg>
    <div class="fx-layer" id="fxLayer"></div>
    <div class="case-lid" id="caseLid" aria-hidden="true"><span class="lid-tag">BOGGLE</span></div>
  </div>
  <div class="words-box">
    <h3>Your words · <span id="wordCount">0</span></h3>
    <div class="tags" id="wordTags"></div>
  </div>
</section>
