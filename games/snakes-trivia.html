<!-- Arenova · Snakes & Trivia screen. Loaded into #gameScreens by index.html -->
<section id="screen-board" class="screen">
  <div class="leave-row"><button type="button" class="game-leave-btn" title="Leave this game" aria-label="Leave this game">↩ Leave game</button></div>
  <div class="card bg-top"><div id="bgTurn"></div><div id="bgChips"></div></div>
  <div class="bg-wrap"><div class="bg-grid" id="bgGrid"></div><div class="bg-start"><span>🏁 START</span></div><svg class="bg-svg" id="bgSvg" viewBox="0 0 800 780"></svg><div class="bg-toks" id="bgToks"></div></div>
  <div class="bg-ctl"><div class="bg-dice" id="bgDice" role="img" aria-label="Die showing 1"><div class="die-face" id="bgDieFace"></div></div><button class="btn btn-gold" id="bgRoll" style="display:none">🎲 Roll the dice!</button></div>
  <div class="bg-info" id="bgInfo"></div>
</section>
