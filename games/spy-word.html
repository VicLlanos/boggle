<!-- Arenova · Spy Word screen. Loaded into #gameScreens by index.html -->
<section id="screen-spy" class="screen">
  <div class="leave-row"><button type="button" class="game-leave-btn" title="Leave this game" aria-label="Leave this game">↩ Leave game</button></div>
  <div class="game-top">
    <div class="timer" id="spyTimerRing"><span id="spyTimerText">90</span></div>
    <div class="scores" id="spyScoreBoard"></div>
    <button class="snd-btn" id="btnSoundSpy" title="Toggle sound">🔊</button>
  </div>
  <div class="card spy-card">
    <div class="spy-round-bar">
      <span id="spyRoundLabel">Round 1 / 5</span>
      <span id="spyScoreLabel">Your points: 0</span>
    </div>
    <div class="spy-role-banner" id="spyRoleBanner">
      <div class="lbl">Your role</div>
      <div class="wrd" id="spyRoleText">—</div>
    </div>
    <div class="spy-phase" id="spyCatChip" style="font-size:1rem;color:var(--violet-d);margin-bottom:2px"></div>
    <div class="spy-phase" id="spyPhaseLabel">Clue phase — give a one-word clue</div>
    <div class="spy-clue-list" id="spyClueList"></div>
    <div class="spy-clue-form" id="spyClueForm" style="display:none">
      <input type="text" id="spyClueInput" placeholder="One-word clue…" maxlength="20" autocomplete="off" autocapitalize="off">
      <button class="btn btn-mint" id="btnSpyClue" style="width:auto;min-width:90px;min-height:48px;padding:10px 14px">Send</button>
    </div>
    <div id="spyVoteArea" style="display:none">
      <div style="font-weight:800;font-size:.85rem;color:#636E72;margin-bottom:6px;text-align:center" id="spyVoteTitle">Who is the spy?</div>
      <div class="spy-vote-grid" id="spyVoteGrid"></div>
      <div id="spyGuessBox" style="display:none;margin-top:10px">
        <div style="font-weight:800;font-size:.85rem;color:#636E72;margin-bottom:6px;text-align:center" id="spyGuessTitle">Guess the secret word</div>
        <div class="spy-clue-form">
          <input type="text" id="spyGuessInput" placeholder="Secret word…" maxlength="45" autocomplete="off" autocapitalize="off">
          <button class="btn btn-gold" id="btnSpyGuess" style="width:auto;min-width:90px;min-height:48px;padding:10px 14px">Guess</button>
        </div>
      </div>
    </div>
    <div class="spy-status" id="spyStatus">Waiting…</div>
    <div style="margin-top:10px">
      <button class="btn btn-mint" id="btnSpyNext" style="display:none">NEXT ROUND →</button>
    </div>
  </div>
</section>
