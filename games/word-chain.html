<!-- Arenova · Word Chain screen. Loaded into #gameScreens by index.html -->
<section id="screen-chain" class="screen">
  <div class="leave-row"><button type="button" class="game-leave-btn" title="Leave this game" aria-label="Leave this game">↩ Leave game</button></div>
  <div class="game-top">
    <div class="timer" id="chTimerRing"><span id="chTimerText">20</span></div>
    <div class="ch-cat" id="chCatChip">🔗 Word Chain</div>
    <button class="snd-btn" id="btnSoundChain" title="Toggle sound">🔊</button>
  </div>
  <div class="card ch-card">
    <div class="ch-roster" id="chRoster"></div>
    <div class="ch-meta" id="chMeta"></div>
    <div class="ch-trail" id="chTrail"></div>
    <div class="ch-undecided" id="chUndecided" style="display:none"></div>
    <div class="ch-turn" id="chTurn">
      <div class="ch-letter" id="chLetter">A</div>
      <div style="min-width:0"><div class="ch-banner" id="chBanner">…</div><div class="ch-sub" id="chSub"></div></div>
    </div>
    <div class="spy-clue-form" id="chForm" style="display:none">
      <input type="text" id="chInput" placeholder="Type your word…" maxlength="30" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="send">
      <button class="btn btn-mint" id="btnChainSend" style="width:auto;min-width:90px;min-height:48px;padding:10px 14px">Send</button>
    </div>
    <div class="ch-msg" id="chMsg"></div>
    <button class="btn ch-chal" id="btnChainChallenge" style="display:none">⚖️ Challenge this word</button>
    <div class="ch-vote" id="chVote" style="display:none">
      <div id="chVoteInfo"></div>
      <div class="ch-vbtns" id="chVoteBtns"></div>
      <div class="ch-vstat" id="chVoteStat"></div>
      <div class="ch-chat" id="chChatList"></div>
      <div class="ch-quick" id="chQuick">
        <button type="button" data-q="That fits 👍">That fits 👍</button>
        <button type="button" data-q="Doesn’t fit 🤔">Doesn’t fit 🤔</button>
        <button type="button" data-q="Not a real word ❌">Not a real word ❌</button>
      </div>
      <div class="spy-clue-form">
        <input type="text" id="chChatInput" placeholder="Discuss…" maxlength="120" autocomplete="off">
        <button class="btn btn-gold" id="btnChainChat" style="width:auto;min-width:80px;min-height:48px;padding:10px 14px">Send</button>
      </div>
    </div>
    <div class="ch-out" id="chOutBanner" style="display:none"></div>
    <div class="ch-over" id="chOver" style="display:none">
      <h3 id="chOverTitle">Game over</h3>
      <div class="ch-stand" id="chStand"></div>
      <button class="btn btn-gold" id="btnChainAgain" style="display:none">🔁 Play again</button>
      <p class="sub" id="chOverWait" style="margin:6px 0 0;display:none">Waiting for the host to start a new game…</p>
    </div>
    <div class="ch-feed" id="chFeed"></div>
    <button class="btn ch-leave" id="btnChainLeave">Leave game</button>
  </div>
</section>
